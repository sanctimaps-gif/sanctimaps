# Relève le calendrier liturgique de l'AELF — ce que l'Église fête chaque jour,
# fêtes mobiles comprises —, pour l'année en cours et la suivante, puis publie.
#
# Le travail se fait sur une machine de GitHub, qui a accès à aelf.org. Il ne
# touche qu'un fichier, `data/aelf/calendrier.json`. Une fois par mois suffit :
# le calendrier d'une année est connu d'avance.
name: Relever le calendrier liturgique (AELF)

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Calendrier de l'AELF (france, belgique, canada, suisse, romain…)"
        required: false
        default: "france"
  schedule:
    - cron: "23 4 2 * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: import-aelf
  cancel-in-progress: false

jobs:
  aelf:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Interroger l'AELF
        run: |
          set -euo pipefail
          node tools/import-aelf.mjs --zone "${{ inputs.zone || 'france' }}" | tee /tmp/aelf.log

      - name: Verser au dépôt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aelf
          if git diff --cached --quiet; then
            echo "Rien de neuf : le calendrier est déjà à jour."
            exit 0
          fi
          git commit -m "Calendrier liturgique de l'AELF relevé" -m "$(tail -8 /tmp/aelf.log)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Demander la reconstruction du site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            && echo "Reconstruction demandée."

      - name: Résumé
        if: always()
        run: |
          {
            echo '## Calendrier liturgique (AELF)'
            echo '```'
            tail -12 /tmp/aelf.log 2>/dev/null || echo "la relève n'a pas abouti"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
