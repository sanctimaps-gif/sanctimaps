# Importe les apparitions depuis Wikidata, puis publie.
#
# À lancer depuis l'onglet « Actions » du dépôt. Le travail se fait sur une
# machine de GitHub, qui a accès à Internet — Wikidata n'est pas joignable
# depuis partout —, et le résultat est versé dans le dépôt, ce qui redéploie le
# site.
#
# Il ne touche qu'un fichier de données, `data/apparitions/wikidata.json`, et ne
# peut donc pas rouvrir le corpus des saints. Ce qui s'ajoute à la main vit dans
# `apparitions.json`, ce qui tranche l'approbation dans `approbations.json` :
# ni l'un ni l'autre n'est réécrit ici.
name: Importer les apparitions

on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Classes Wikidata imposées (Q…,Q…), vide pour les chercher"
        required: false
        default: ""
      bios:
        description: "Aller chercher les récits sur Wikipédia"
        type: boolean
        required: false
        default: true
      dry_run:
        description: "Interroger et compter sans rien écrire"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: import-apparitions
  cancel-in-progress: false

jobs:
  apparitions:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les jeux de données sources
        run: npm ci

      - name: Interroger Wikidata
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.classes }}" ]; then args+=(--classes "${{ inputs.classes }}"); fi
          if [ "${{ inputs.bios }}" != "true" ]; then args+=(--no-bios); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          node tools/import-apparitions.mjs "${args[@]}" | tee /tmp/apparitions.log

      # Rien n'est publié sans être passé par les mêmes contrôles que le reste.
      - name: Régénérer et contrôler
        run: |
          set -euo pipefail
          npm run build:data | tee /tmp/build.log
          npm run build:pages | tee /tmp/pages.log
          node tools/build-feed.mjs | tee /tmp/feed.log
          npm run check

      - name: Verser au dépôt
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apparitions data/generated saints pays lieux calendrier epoques \
            lettre lettre.html sitemap.xml robots.txt feed.xml
          if git diff --cached --quiet; then
            echo "Rien de neuf : les apparitions sont déjà à jour."
            exit 0
          fi
          retenues=$(grep -oE '[0-9]+ apparitions retenues sur [0-9]+' /tmp/apparitions.log \
            | head -1 || echo "Apparitions importées")
          git commit -m "${retenues}" -m "$(cat /tmp/apparitions.log)"
          git push origin HEAD:${{ github.ref_name }}

      # Un envoi fait avec le jeton du dépôt ne réveille pas les autres
      # ateliers : la reconstruction du site se demande donc explicitement.
      - name: Demander la reconstruction du site
        if: inputs.dry_run != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            && echo "Reconstruction demandée."

      - name: Résumé
        if: always()
        run: |
          {
            echo '## Apparitions'
            echo '```'
            cat /tmp/apparitions.log 2>/dev/null || echo "la collecte n'a pas abouti"
            echo '```'
            grep -E 'Approbations|apparitions.json' /tmp/build.log 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
