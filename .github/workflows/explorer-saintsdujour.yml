# Temporaire : relève la structure de saintsdujour.fr (pages, liens, ordre des
# saints) pour écrire l'outil d'import. À retirer une fois l'outil écrit.
name: Explorer saintsdujour.fr

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Relever
        run: |
          set -u
          UA="SanctiMaps/1.0 (https://github.com/sanctimaps-gif/sanctimaps)"
          curl -sSL -A "$UA" -m 30 https://saintsdujour.fr/ -o /tmp/home.html
          echo "=================== accueil, sans les listes"
          python3 - <<'PY'
          import re
          h = open('/tmp/home.html', encoding='utf-8', errors='replace').read()
          h = re.sub(r"data-saints='[^']*'", lambda m: f"data-saints=[{len(m.group(0))} car.]", h)
          print(h[:30000])
          print('......')
          for s in re.findall(r'<script[^>]*>(.*?)</script>', open('/tmp/home.html', encoding='utf-8', errors='replace').read(), re.S):
            print('--- SCRIPT', len(s)); print(s[:6000])
          PY
          echo "=================== une liste complète (7 octobre)"
          python3 - <<'PY'
          import re, html, json
          h = open('/tmp/home.html', encoding='utf-8', errors='replace').read()
          for m in re.finditer(r"data-saints='([^']*)'\s*data-date=\"([^\"]+)\"", h):
            if m.group(2) in ('07-10', '02-10'):
              data = json.loads(html.unescape(m.group(1)))
              print(m.group(2), len(data))
              for d in data: print({k: (str(v)[:80]) for k, v in d.items()})
          PY
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/home.html | cut -d'"' -f2 | head -5); do
            echo "=================== JS $js"
            curl -sSL -A "$UA" -m 30 "https://saintsdujour.fr$js" | head -c 12000; echo
          done
          echo "=================== fiche"
          curl -sSL -A "$UA" -m 30 https://saintsdujour.fr/n/33279004-3154-4337-bdee-166440682020 | sed -e 's/<[^>]*>/\n/g' | sed '/^\s*$/d' | head -80
